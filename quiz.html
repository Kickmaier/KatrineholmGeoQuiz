<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tippspromenaden</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div id="start-overlay">
        <button id = "start-game"></button>
    </div>
    <div id="map" class="geo"></div>
    <video id="video-area" autoplay playsinline muted></video>
    <div id="distance-meter" class="hidden" ><span id= "meter-count">0</span></div>
    <div id = "img-overlay" class="hidden">
        <img id = overlay-image src="" alt="Target">
    </div>
    <div id="trivia" class="hidden"></div>
    <div id="result-container" class="hidden">
        <div id="result-text"></div>
        <nav id="home-button"></nav>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script/global.js" defer></script>
    <script src="script/quiz.js" defer></script>
    <script src="script/geo.js" defer></script>
    <script src="script/ui.js" defer></script>
</body>
</html>
